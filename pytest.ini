[pytest]
# CipherLock Phase 1 – pytest configuration
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Surface all deprecation warnings from test code and imported libraries
filterwarnings =
    error
    ignore::DeprecationWarning
    ignore::ResourceWarning
    ignore::pytest.PytestUnraisableExceptionWarning

# Short summary flags: show extra test summary info for failures and errors
addopts = -ra -q
